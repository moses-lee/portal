services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      # 5433 on the host so a Homebrew Postgres on 5432 does not collide.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/<major>/docker, so mount the parent.
      - portal-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  portal-postgres:
